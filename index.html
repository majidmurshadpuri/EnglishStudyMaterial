<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Updates Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>📢 Website Updates</h1>
    <div id="lastChecked">Checking...</div>
</header>

<section class="toolbar">
    <input
        type="search"
        id="searchBox"
        placeholder="Search updates...">

    <select id="siteFilter">
        <option value="all">All Websites</option>
    </select>

    <label>
        <input type="checkbox" id="newOnly">
        New Only
    </label>

    <button id="markRead">
        Mark All Read
    </button>
</section>

<main id="dashboard">

</main>

<template id="siteCard">

    <article class="card">

        <div class="cardHeader">

            <h2 class="siteName"></h2>

            <span class="count"></span>

        </div>

        <div class="items"></div>

    </article>

</template>

<script src="app.js"></script>

</body>
</html>
