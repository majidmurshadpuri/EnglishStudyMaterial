<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Reformation — Master Guide | UPPSC GIC English</title>
<style>
  :root{
    --bg:#12100e;
    --bg-2:#1c1712;
    --panel:#221c16;
    --panel-2:#2a2219;
    --line:#3a2f22;
    --gold:#c9a24b;
    --gold-soft:#e6c874;
    --ember:#b5452f;
    --text:#ece7dc;
    --text-dim:#b3a99a;
    --text-faint:#867d6d;
    --serif: Georgia, 'Iowan Old Style', 'Palatino Linotype', Palatino, serif;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    --radius: 14px;
    --fs: 16px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(1200px 600px at 50% -10%, #241c14 0%, transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:var(--sans);
    font-size:var(--fs);
    overflow:hidden;
  }

  /* ===== APP SHELL ===== */
  #app{
    position:fixed; inset:0;
    display:flex; flex-direction:column;
    max-width:720px; margin:0 auto;
    background:var(--bg);
    border-left:1px solid var(--line);
    border-right:1px solid var(--line);
  }

  header{
    flex:0 0 auto;
    display:flex; align-items:center; gap:12px;
    padding:14px 14px 12px 10px;
    background:linear-gradient(180deg, var(--bg-2), var(--bg));
    border-bottom:1px solid var(--line);
    z-index:20;
  }
  #hamburger{
    width:42px; height:42px; flex:0 0 auto;
    border:1px solid var(--line); border-radius:10px;
    background:var(--panel);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  #hamburger .bars{position:relative; width:18px; height:12px;}
  #hamburger .bars span{position:absolute; left:0; width:18px; height:2px; background:var(--gold-soft); border-radius:2px;}
  #hamburger .bars span:nth-child(1){top:0;}
  #hamburger .bars span:nth-child(2){top:5px;}
  #hamburger .bars span:nth-child(3){top:10px;}

  .brand{display:flex; flex-direction:column; line-height:1.15; overflow:hidden;}
  .brand-title{font-family:var(--serif); font-size:17px; letter-spacing:.3px; color:var(--gold-soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .brand-sub{font-size:11px; color:var(--text-faint); letter-spacing:.4px; text-transform:uppercase;}

  #fontCtrl{margin-left:auto; display:flex; gap:6px; flex:0 0 auto;}
  #fontCtrl button{
    width:32px; height:32px; border-radius:8px;
    background:var(--panel); border:1px solid var(--line); color:var(--text-dim);
    font-size:14px; cursor:pointer;
  }

  #progressBar{
    flex:0 0 auto;
    display:flex; gap:4px; padding:8px 14px; background:var(--bg);
    border-bottom:1px solid var(--line);
    overflow-x:auto;
  }
  #progressBar .dot{flex:1 0 8px; height:5px; border-radius:4px; background:var(--line); min-width:8px;}
  #progressBar .dot.done{background:var(--gold);}
  #progressBar .dot.active{background:var(--gold-soft);}

  main{
    flex:1 1 auto;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    padding:18px 16px 90px 16px;
  }
  .screen{display:none; animation:fadeIn .25s ease;}
  .screen.active{display:block;}
  @keyframes fadeIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

  .eyebrow{
    font-size:11px; letter-spacing:1.5px; text-transform:uppercase; color:var(--ember);
    font-weight:600; margin-bottom:6px;
  }
  h1.screen-title{
    font-family:var(--serif); font-size:26px; color:var(--gold-soft); margin:0 0 14px 0;
    line-height:1.25; border-bottom:1px solid var(--line); padding-bottom:12px;
  }
  h1.screen-title .drop{
    font-size:44px; float:left; line-height:.8; padding:4px 8px 0 0; color:var(--gold);
    font-family:var(--serif);
  }
  h2{font-family:var(--serif); font-size:18.5px; color:var(--gold-soft); margin:22px 0 8px;}
  h3{font-size:15.5px; color:var(--text); margin:16px 0 6px; font-weight:700;}
  p{color:var(--text-dim); line-height:1.65; margin:0 0 10px;}
  b, strong{color:var(--text);}
  ul, ol{margin:6px 0 12px; padding-left:20px; color:var(--text-dim); line-height:1.6;}
  li{margin-bottom:6px;}
  .callout{
    background:var(--panel); border:1px solid var(--line); border-left:3px solid var(--gold);
    border-radius:10px; padding:12px 14px; margin:14px 0; color:var(--text-dim); font-size:14.5px;
  }
  .callout b{color:var(--gold-soft);}
  .tagbox{display:flex; flex-wrap:wrap; gap:6px; margin:10px 0 16px;}
  .tag{
    font-size:12px; background:var(--panel-2); border:1px solid var(--line); color:var(--text-dim);
    padding:5px 10px; border-radius:20px;
  }

  details{
    background:var(--panel); border:1px solid var(--line); border-radius:12px;
    margin-bottom:10px; overflow:hidden;
  }
  details[open]{border-color:#4a3a26;}
  summary{
    list-style:none; cursor:pointer; padding:13px 14px; font-weight:600; color:var(--text);
    display:flex; align-items:center; gap:8px; font-size:14.5px;
  }
  summary::-webkit-details-marker{display:none;}
  summary::before{content:'▸'; color:var(--gold); font-size:12px; transition:transform .2s; flex:0 0 auto;}
  details[open] summary::before{transform:rotate(90deg);}
  .details-body{padding:0 16px 16px;}
  .details-body p:first-child{margin-top:0;}

  .qcard{
    background:var(--panel); border:1px solid var(--line); border-radius:12px;
    padding:12px 14px; margin-bottom:10px;
  }
  .qcard .qnum{color:var(--ember); font-weight:700; font-size:13px;}
  .qcard .qtext{color:var(--text); font-weight:600; margin-top:2px; font-size:14.5px; line-height:1.4;}

  table{width:100%; border-collapse:collapse; margin:10px 0 16px; font-size:13.5px;}
  th,td{border:1px solid var(--line); padding:8px; text-align:left; color:var(--text-dim);}
  th{color:var(--gold-soft); background:var(--panel-2);}

  .navrow{
    display:flex; justify-content:space-between; gap:10px; margin-top:26px; padding-top:16px;
    border-top:1px solid var(--line);
  }
  .navbtn{
    flex:1; text-align:center; padding:12px; border-radius:10px; border:1px solid var(--line);
    background:var(--panel); color:var(--text); font-size:13.5px; cursor:pointer;
  }
  .navbtn.disabled{opacity:.35; pointer-events:none;}
  .navbtn .lbl{display:block; font-size:10.5px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.5px; margin-bottom:2px;}

  #overlay{
    position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:30;
    opacity:0; pointer-events:none; transition:opacity .25s;
  }
  #overlay.show{opacity:1; pointer-events:auto;}
  #drawer{
    position:fixed; top:0; bottom:0; left:-300px; width:280px; max-width:82vw;
    background:var(--bg-2); border-right:1px solid var(--line); z-index:31;
    transition:left .28s ease; display:flex; flex-direction:column;
  }
  #drawer.show{left:0;}
  .drawer-head{padding:18px 16px 12px; border-bottom:1px solid var(--line);}
  .drawer-head .t1{font-family:var(--serif); color:var(--gold-soft); font-size:18px;}
  .drawer-head .t2{font-size:11.5px; color:var(--text-faint); margin-top:2px;}
  nav#menu{flex:1; overflow-y:auto; padding:8px;}
  .menu-item{display:flex; align-items:center; gap:10px; padding:11px 10px; border-radius:9px; cursor:pointer; color:var(--text-dim); font-size:14px;}
  .menu-item .num{
    width:22px; height:22px; border-radius:6px; background:var(--panel); border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center; font-size:11px; color:var(--text-faint); flex:0 0 auto;
  }
  .menu-item.active{background:var(--panel-2); color:var(--gold-soft);}
  .menu-item.active .num{background:var(--gold); color:#1a1508; border-color:var(--gold);}
  .menu-item:active{background:var(--panel);}
  .menu-section-label{font-size:10.5px; text-transform:uppercase; letter-spacing:1px; color:var(--text-faint); padding:14px 10px 6px;}

  .flame{color:var(--gold);}

  ::-webkit-scrollbar{width:6px; height:6px;}
  ::-webkit-scrollbar-thumb{background:var(--line); border-radius:4px;}

  @media (min-width:760px){ body{overflow:auto;} }
</style>
</head>

<script>
/* ============ CONTENT MODEL ============ */
const sections = [
{
  group:"Start Here",
  title:"Welcome",
  short:"How to use this app",
  html:`
    <div class="eyebrow">Before you begin</div>
    <h1 class="screen-title"><span class="drop">T</span>he companion topic to Renaissance</h1>
    <p>This app covers <b>"Reformation"</b> for the UPPSC GIC (Government Inter College) English Lecturer Mains exam, built from your syllabus (Section A: Authors & Works, Section B: Literary terms/Movements/Forms).</p>
    <div class="callout"><b>Why this topic matters:</b> "Reformation" is not just a religious history fact — it is the reason English literature has its own vernacular Bible, why writers like <b>Milton</b> exist in the form they do, why <b>Puritanism</b> shut the theatres in 1642, and why English prose developed the plain, direct style it did. Examiners connect it constantly to Renaissance and to authors in your Section A list — so this app treats it as a linked topic, not an isolated date.</p>
    <h2>How this app is built</h2>
    <ul>
      <li>Each menu item is a full "screen" — tap once, read, no endless scrolling.</li>
      <li>Boxes with ▸ hide extra detail — open only what you need.</li>
      <li>Use <b>A-/A+</b> top-right to resize text.</li>
      <li>Your last screen and font size are remembered automatically.</li>
    </ul>
    <div class="callout"><b>Suggested order:</b> Read "Foundations" screens fully first (basic idea → advanced). Then read "Literature of the Age" screens, which show how Reformation actually shaped writing. Finish with "Exam Preparation" — expected questions and full model answers.</div>
  `
},
{
  group:"Foundations",
  title:"What is the Reformation?",
  short:"Meaning, origin, basic idea",
  html:`
    <div class="eyebrow">Foundation · 1 of 6</div>
    <h1 class="screen-title"><span class="drop">L</span>et's start from zero</h1>
    <h2>1. The basic idea</h2>
    <p>For over a thousand years before the 1500s, almost all of Western Europe belonged to <b>one</b> Church — the <b>Roman Catholic Church</b>, headed by the Pope in Rome. This one Church controlled religious belief, decided what was "correct" worship, and was extremely rich and powerful.</p>
    <p>By the early 1500s, many people felt this Church had become corrupt and had drifted away from the simple teachings of the Bible. The <b>Reformation</b> was the movement to "reform" (fix, purify, correct) the Church — but instead of fixing it from inside, it ended up <b>splitting</b> it. New, separate Christian groups broke away from Rome. These break-away groups are called <b>Protestant</b> (because they "protested" against Rome).</p>
    <div class="callout"><b>One-line exam definition:</b> The Reformation was a 16th-century religious movement that challenged the authority and practices of the Roman Catholic Church, leading to the rise of Protestant churches across Europe, and in England, to the formation of a separate national Church under the King instead of the Pope.</div>
    <h2>2. Where and when did it start?</h2>
    <ul>
      <li>It began in <b>Germany</b> in <b>1517</b>, when a monk named <b>Martin Luther</b> publicly challenged the Church's practices (see next screens for detail).</li>
      <li>It spread quickly across Europe — Switzerland (Calvin), and reached <b>England</b> in a very particular, political way starting in the <b>1530s</b>, under King <b>Henry VIII</b>.</li>
      <li>In England, the process of Reformation, its reversals, and its final settlement stretched across the whole <b>16th century</b>, roughly <b>1534 to 1559</b>, with after-effects (Puritanism) lasting into the 1600s.</li>
    </ul>
    <h2>3. Do not confuse it with the Renaissance</h2>
    <p>Students often mix these two up because they happened at almost the same time. Keep this clear from day one:</p>
    <ul>
      <li><b>Renaissance</b> = revival of classical (Greek/Roman) learning and art — a <b>cultural</b> movement.</li>
      <li><b>Reformation</b> = challenge to Church authority and reform of religion — a <b>religious</b> movement.</li>
    </ul>
    <p>They happened side by side, influenced each other, but are not the same thing (a full comparison screen is coming up).</p>
  `
},
{
  group:"Foundations",
  title:"Causes of the Reformation",
  short:"Why the Church split",
  html:`
    <div class="eyebrow">Foundation · 2 of 6</div>
    <h1 class="screen-title"><span class="drop">N</span>othing splits without real reasons</h1>
    <p>Never just say "the Church was corrupt" in an answer. Explain the actual reasons — this is where the marks are.</p>

    <details><summary>1. Corruption inside the Church</summary>
      <div class="details-body">
        <p>Many Church leaders (bishops, even Popes) lived in luxury, far from simple religious life. The most famous complaint was about <b>"indulgences"</b> — payments made to the Church that were said to reduce a person's punishment for sin. Selling forgiveness for money looked, to many, like corruption rather than true religion.</p>
      </div>
    </details>

    <details><summary>2. Martin Luther's challenge (1517)</summary>
      <div class="details-body">
        <p>Luther, a German monk, nailed his <b>"95 Theses"</b> (95 written arguments, mainly against the sale of indulgences) to a church door in Wittenberg. This is usually taken as the exact starting point of the Reformation. (Full detail on the next screen.)</p>
      </div>
    </details>

    <details><summary>3. The printing press</summary>
      <div class="details-body">
        <p>Just as it helped spread Renaissance classical texts, the printing press (invented ~1450) let Luther's ideas, and soon vernacular (local-language) Bibles, spread across Europe fast and cheap — something impossible when every book had to be copied by hand.</p>
      </div>
    </details>

    <details><summary>4. Renaissance Humanism's influence</summary>
      <div class="details-body">
        <p>Humanist scholars had trained themselves to read Greek and Hebrew and to study old texts critically and directly, instead of just accepting the Church's official Latin translation. This same skill and habit of questioning old authority — learned from Renaissance humanism — was turned by reformers onto the Bible and Church tradition itself.</p>
      </div>
    </details>

    <details><summary>5. Political and personal reasons (especially in England)</summary>
      <div class="details-body">
        <p>In England specifically, the Reformation was triggered less by pure religious protest and more by <b>King Henry VIII's</b> personal and political needs — he wanted his marriage to Catherine of Aragon annulled (cancelled) so he could marry Anne Boleyn, and the Pope refused. Henry's solution was to break away from Rome entirely and make himself, not the Pope, head of the English Church. (Full detail on the England screen.)</p>
      </div>
    </details>

    <div class="callout"><b>Simple memory device:</b> Think of it as <b>"C-L-P-H-K"</b> — Church <b>C</b>orruption, <b>L</b>uther's 95 Theses, <b>P</b>rinting press, <b>H</b>umanist scholarship, and <b>K</b>ing Henry's political needs (England-specific).</div>
  `
},
{
  group:"Foundations",
  title:"Martin Luther & the Continental Reformation",
  short:"Where it all began",
  html:`
    <div class="eyebrow">Foundation · 3 of 6</div>
    <h1 class="screen-title"><span class="drop">A</span> monk challenges Rome</h1>
    <h2>1. Who was Martin Luther?</h2>
    <p>Martin Luther (1483–1546) was a German monk and professor of theology. He believed the Church's practice of selling indulgences (paying money to reduce punishment for sin) was wrong, because it suggested that <b>salvation could be bought</b>, rather than earned through genuine faith.</p>

    <h2>2. The 95 Theses (1517)</h2>
    <p>In 1517, Luther wrote 95 formal arguments against Church practices, mainly the sale of indulgences, and (according to tradition) posted them on the door of a church in Wittenberg, Germany. This act is treated as the symbolic start of the Reformation.</p>

    <h2>3. Luther's core ideas — remember these three</h2>
    <ul>
      <li><b>Sola Fide (Faith Alone):</b> a person is saved by genuine faith in God, not by buying indulgences or by "good works" alone.</li>
      <li><b>Sola Scriptura (Scripture Alone):</b> the Bible itself, not Church tradition or the Pope's word, is the highest religious authority. This is exactly why Bible translation into everyday language became so important (see the Bible-translation screen).</li>
      <li><b>Priesthood of all believers:</b> every believer can read and understand the Bible directly and approach God directly — you don't strictly need a priest as a middleman. This idea fed strongly into a new sense of individual conscience and personal judgement.</li>
    </ul>

    <h2>4. What happened next</h2>
    <ul>
      <li>The Pope excommunicated Luther (expelled him from the Church) in 1521.</li>
      <li>Luther translated the Bible into German, so ordinary people could read it themselves — the direct model that England's Bible translators (Tyndale and later King James translators) followed.</li>
      <li>Other reformers followed — most importantly <b>John Calvin</b> in Switzerland (Geneva), whose stricter, more disciplined version of Protestant belief (called <b>Calvinism</b>) strongly influenced English <b>Puritanism</b> later.</li>
    </ul>
    <div class="callout"><b>Exam tip:</b> If asked generally about "the Reformation," always start on the continent with Luther (1517) before moving to England — examiners want to see you know the movement did not begin in England; England's version came later and had its own political flavour.</div>
  `
},
{
  group:"Foundations",
  title:"The English Reformation",
  short:"Henry VIII and after",
  html:`
    <div class="eyebrow">Foundation · 4 of 6</div>
    <h1 class="screen-title"><span class="drop">E</span>ngland's own, very political, story</h1>
    <p>This is the single most exam-important screen on this topic. The English Reformation did not happen mainly because of theology — it happened mainly because of a <b>king's marriage problem</b>, and then grew into something bigger. Learn this as a sequence of stages.</p>

    <details open><summary>Stage 1 — Henry VIII breaks from Rome (1530s)</summary>
      <div class="details-body">
        <p>King <b>Henry VIII</b> wanted to end his marriage to Catherine of Aragon (who had not given him a surviving son) and marry Anne Boleyn instead. The Pope refused to grant an annulment. Henry's response: break England away from the Pope's authority completely.</p>
        <ul>
          <li><b>Act of Supremacy (1534):</b> made the King, not the Pope, the "Supreme Head" of the Church in England — creating the <b>Church of England</b>.</li>
          <li><b>Dissolution of the Monasteries (1536–1541):</b> Henry shut down monasteries across England and took their land and wealth for the Crown — a huge economic and social change, not just a religious one.</li>
          <li>Important: Henry's own personal religious beliefs stayed fairly close to Catholic tradition — this was mainly a break in <b>authority</b> (King instead of Pope), not yet a full theological Protestant revolution.</li>
        </ul>
      </div>
    </details>

    <details><summary>Stage 2 — Edward VI: a more Protestant turn (1547–1553)</summary>
      <div class="details-body">
        <p>Henry's young son Edward VI's government pushed England more firmly towards genuine Protestant belief (closer to Luther's and Calvin's ideas) — including an English-language Prayer Book (<i>Book of Common Prayer</i>, 1549) for church services instead of Latin.</p>
      </div>
    </details>

    <details><summary>Stage 3 — Mary I: Catholic restoration (1553–1558)</summary>
      <div class="details-body">
        <p>Edward's half-sister <b>Mary I</b> (a devout Catholic) tried to reverse the Reformation and bring England back under the Pope. She had many Protestants executed for their beliefs — earning her the nickname <b>"Bloody Mary."</b> This shows the Reformation in England was not a smooth, one-direction process — it swung back and forth violently depending on who was on the throne.</p>
      </div>
    </details>

    <details><summary>Stage 4 — The Elizabethan Settlement (from 1559)</summary>
      <div class="details-body">
        <p>Queen <b>Elizabeth I</b> (Mary's half-sister) took a middle path — often called the <b>via media</b> ("middle way") — keeping some traditional/Catholic-style structure (bishops, ceremony) but firmly Protestant in core belief, with the monarch as head of the Church. The <b>Act of Supremacy (1559)</b> and <b>Act of Uniformity (1559)</b> settled this. This settlement gave England the religious stability that allowed the great literary flowering of the <b>Elizabethan Age</b> (see your Renaissance study material) to happen.</p>
      </div>
    </details>

    <div class="callout"><b>Exam-ready summary line:</b> "The English Reformation began as a political act by Henry VIII to secure his own authority and succession, swung between Protestant and Catholic extremes under his children Edward and Mary, and was finally settled into a moderate, distinctly English Protestant Church under Elizabeth I's 'via media' — a settlement stable enough to allow the literary Golden Age that followed."</div>
  `
},
{
  group:"Foundations",
  title:"Reformation vs Renaissance",
  short:"The most commonly confused pair",
  html:`
    <div class="eyebrow">Foundation · 5 of 6</div>
    <h1 class="screen-title"><span class="drop">T</span>wo movements, one age</h1>
    <p>Examiners frequently ask you to relate these two movements — approach it exactly like this: define separately, compare, then connect.</p>

    <h2>1. Quick separate definitions</h2>
    <div class="callout"><b>Renaissance</b> = revival of classical Greek/Roman learning and art; focus shifts to Man and this world. <br><b>Reformation</b> = challenge to the Roman Catholic Church's authority, leading to new Protestant churches; focus stays on God, but on a more direct, personal, scripture-based relationship with Him.</div>

    <h2>2. Side-by-side comparison</h2>
    <table>
      <tr><th>Renaissance</th><th>Reformation</th></tr>
      <tr><td>Cultural / intellectual / artistic</td><td>Religious / institutional</td></tr>
      <tr><td>Revives classical (often pagan) learning</td><td>Returns to the Bible as sole authority</td></tr>

      lastGroup = s.group;
    }
    const item = document.createElement('div');
    item.className = 'menu-item';
    item.id = 'menu-' + i;
    item.innerHTML = `<div class="num">${i+1}</div><div><div>${s.title}</div></div>`;
    item.onclick = () => { goTo(i); toggleDrawer(false); };
    menuEl.appendChild(item);
  });
}

function buildScreens(){
  sections.forEach((s, i) => {
    const div = document.createElement('div');
    div.className = 'screen';
    div.id = 'screen-' + i;
    div.innerHTML = s.html + buildNavRow(i);
    mainEl.appendChild(div);
  });
}

function buildNavRow(i){
  const prev = i > 0 ? sections[i-1].title : null;
  const next = i < sections.length-1 ? sections[i+1].title : null;
  return `
  <div class="navrow">
    <div class="navbtn ${prev?'':'disabled'}" onclick="goTo(${i-1})"><span class="lbl">◂ Previous</span>${prev||''}</div>
    <div class="navbtn ${next?'':'disabled'}" onclick="goTo(${i+1})"><span class="lbl">Next ▸</span>${next||''}</div>
  </div>`;
}

function buildProgress(){
  progressEl.innerHTML = '';
  sections.forEach((s,i) => {
    const d = document.createElement('div');
    d.className = 'dot';
    d.id = 'dot-' + i;
    d.onclick = () => goTo(i);
    progressEl.appendChild(d);
  });
}

function goTo(i){
  if(i < 0 || i >= sections.length) return;
  document.getElementById('screen-'+currentIndex).classList.remove('active');
  document.getElementById('menu-'+currentIndex).classList.remove('active');
  currentIndex = i;
  document.getElementById('screen-'+i).classList.add('active');
  document.getElementById('menu-'+i).classList.add('active');
  document.getElementById('screenLabel').textContent = sections[i].group + ' · ' + sections[i].title;
  updateProgress();
  mainEl.scrollTop = 0;
  try{ localStorage.setItem('reformation_lastScreen', i); }catch(e){}
  document.getElementById('menu-'+i).scrollIntoView({block:'nearest'});
}

function updateProgress(){
  sections.forEach((s,i) => {
    const d = document.getElementById('dot-'+i);
    d.classList.toggle('active', i===currentIndex);
    d.classList.toggle('done', i<currentIndex);
  });
}

function toggleDrawer(show){
  document.getElementById('drawer').classList.toggle('show', show);
  document.getElementById('overlay').classList.toggle('show', show);
}

function changeFont(dir){
  let root = document.documentElement;
  let current = parseInt(getComputedStyle(root).getPropertyValue('--fs')) || 16;
  let next = Math.min(20, Math.max(13, current + dir));
  root.style.setProperty('--fs', next + 'px');
  try{ localStorage.setItem('reformation_fontSize', next); }catch(e){}
}

/* ============ INIT ============ */
buildMenu();
buildScreens();
buildProgress();

try{
  const savedFont = localStorage.getItem('reformation_fontSize');
  if(savedFont) document.documentElement.style.setProperty('--fs', savedFont + 'px');
}catch(e){}

let startIndex = 0;
try{
  const saved = localStorage.getItem('reformation_lastScreen');
  if(saved !== null) startIndex = parseInt(saved);
}catch(e){}
if(isNaN(startIndex) || startIndex < 0 || startIndex >= sections.length) startIndex = 0;

document.getElementById('screen-'+startIndex).classList.add('active');
document.getElementById('menu-'+startIndex).classList.add('active');
currentIndex = startIndex;
document.getElementById('screenLabel').textContent = sections[startIndex].group + ' · ' + sections[startIndex].title;
updateProgress();
setTimeout(()=>{ document.getElementById('menu-'+startIndex).scrollIntoView({block:'nearest'}); }, 50);
</script>
</body>
</html>
