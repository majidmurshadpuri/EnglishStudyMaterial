  <p class="dropcap">The syllabus lists <b>"Renaissance"</b> as one bullet point under <b>Section B: Literary Terms, Movements, Forms, Literary Criticism</b>. This kind of single-bullet topic usually turns into <b>one full 20-mark descriptive question</b>, sometimes split into two 10-mark parts, and it can also appear as a <b>15-20 mark short note</b>. Because your outline specifically links Renaissance to Shakespeare, Milton and Donne, the examiner may also test the topic <b>through</b> these authors (who are separately listed under Section A). Prepare fully for all of the following.</p>

{
  id:"intro", color:"crimson", eyebrow:"1 · Foundation",
  title:"What Is the Renaissance?",
  sub:"The basic idea, explained in the simplest way possible",
  body:`
  <p class="dropcap">Imagine Europe somewhere between the 14th and 16th centuries. For almost a thousand years before this (roughly 500 AD to 1400 AD — the period we call the <b>Middle Ages</b>), most people's lives revolved around one big idea: the Church, God, and the afterlife. Learning was mostly religious. Art mostly showed saints and Biblical scenes in a flat, symbolic way. People were taught to think of themselves as small, sinful creatures whose main job was to prepare for the next world.</p>

  <p>Then, starting in Italy, something began to change. Scholars started digging up and reading the old books of <b>ancient Greece and Rome</b> — philosophy, poetry, history, science — which had been mostly forgotten or ignored for centuries. Reading these old, brilliant, human-centred books made people excited about a new possibility: that human beings themselves — their minds, their bodies, their achievements in THIS world — were worth celebrating, not just the next world. This whole change is called the <b>Renaissance</b>.</p>

  <div class="card crimson">
    <span class="card-label">Meaning of the Word</span>
    <p style="margin:0"><b>Renaissance</b> is a French word meaning <b>"rebirth."</b> It refers to the "rebirth" of interest in ancient Greek and Roman learning, art, and values, after centuries in which this classical knowledge had been largely neglected in Western Europe. It is NOT a rebirth of religion — it is a rebirth of interest in human achievement, reason, and classical culture.</p>
  </div>

  <p>This "rebirth" began in Italy (Florence, in particular) around the <b>14th century</b>, and slowly spread across Europe — reaching <b>England later than most of Europe</b>, roughly from the late 15th century, but reaching its fullest, richest flowering in England during the <b>Elizabethan and early Jacobean period (roughly 1550s-1630s)</b> — exactly the period of Shakespeare, Spenser, Marlowe, Donne, and (a little later) Milton.</p>

  <h3 class="h">In One Line (write this first in your answer)</h3>
  <div class="quote-block">The Renaissance was a great intellectual and cultural movement (originating in 14th-century Italy, reaching England around 1500-1650) marked by a revival of interest in classical Greek and Roman learning, a new confidence in human reason and individual achievement, and a shift of attention from purely religious concerns towards the richness of human life in this world.</div>

  <h3 class="h">Why You Must Understand This Before Anything Else</h3>
  <ul>
    <li>Every feature discussed later (humanism, individualism, love of classical learning, scientific curiosity, this-worldliness) is simply this ONE basic idea applied to a different area of life. If you understand this base idea, every other point becomes easy to explain rather than something to memorise separately.</li>
    <li>Always contrast the Renaissance with the <b>Middle Ages</b> in your introduction — examiners reward this contrast because it shows you understand WHY the Renaissance mattered, not just WHAT it was.</li>
  </ul>
  `
},

{
  id:"origin", color:"emerald", eyebrow:"2 · Background",
  title:"Origin and Historical Background",
  sub:"Where it started, how it travelled to England, and why",
  body:`
  <p class="dropcap">To write a strong "origin" paragraph, you need three things clearly in your head: WHERE it began, WHAT caused it to begin and spread, and WHEN it reached England.</p>

  <h3 class="h">Where It Began — Italy</h3>
  <ul>
    <li>The Renaissance began in the wealthy city-states of Italy — especially <b>Florence</b> — in the <b>14th century</b>.</li>
    <li>Italy was the natural birthplace because it sat on the ruins of the old <b>Roman Empire</b> — Roman buildings, statues, and manuscripts were physically present all around Italian scholars, constantly reminding them of a great past civilisation.</li>
    <li>Early Italian figures who sparked this revival of classical learning include <b>Petrarch</b> (often called the "father of Humanism," also famous for inventing the Petrarchan sonnet form) and <b>Boccaccio</b>.</li>
  </ul>

  <h3 class="h">What Caused It To Spread</h3>
  <ul>
    <li><b>Fall of Constantinople (1453):</b> When the Byzantine Empire's capital fell to the Ottoman Turks, many Greek scholars fled to Italy, bringing with them old Greek manuscripts and a deep knowledge of ancient Greek philosophy and literature.</li>
    <li><b>Invention of the printing press (Gutenberg, around 1450):</b> Before this, books had to be copied out by hand, so they were rare and expensive. The printing press made it possible to produce many copies of a book quickly and cheaply, so classical texts (and new Renaissance ideas) could spread across Europe far faster than ever before.</li>
    <li><b>Trade and travel:</b> Wealthy Italian trading cities had money to support artists and scholars (this financial support is called <b>"patronage"</b>), and increased travel and trade carried Renaissance ideas across the continent.</li>
    <li><b>Voyages of discovery:</b> Explorers like Columbus and Vasco da Gama expanded Europe's sense of the world, encouraging curiosity, confidence, and a spirit of adventure that matched the Renaissance mood.</li>
  </ul>

  <h3 class="h">When and How It Reached England</h3>
  <ul>
    <li>England received the Renaissance <b>later</b> than Italy or France — mainly from the late 15th century onward, and it did not reach its full literary flowering until the <b>reign of Queen Elizabeth I (1558-1603)</b>.</li>
    <li>Key carriers of Renaissance ideas into England: English scholars who travelled to Italy and brought back classical learning; the translation of Italian and classical works into English; and the printing press, which had reached England through <b>William Caxton</b> (who set up England's first printing press in 1476).</li>
    <li>English humanist scholars such as <b>Sir Thomas More</b> (author of <i>Utopia</i>) and <b>Roger Ascham</b> helped establish "the New Learning" (classical, humanist education) in England.</li>
    <li>The <b>Tudor monarchs</b>, especially Henry VIII and later Elizabeth I, were themselves well-educated in classical learning and encouraged art, literature, and scholarship at court — royal support mattered a great deal in spreading Renaissance culture downward through society.</li>
  </ul>

  <div class="card emerald">
    <span class="card-label">Easy Way To Remember The Timeline</span>
    <p style="margin:0">Italy catches the spark first (1300s) → the spark travels across Europe through fallen scholars, printed books, and trade (1400s) → England catches it late but burns brightest during Elizabeth I's reign (1558-1603) → the flame is still glowing in early Jacobean writers like Donne and, at its last and most majestic, in Milton (mid-1600s).</p>
  </div>

  <h3 class="h">Renaissance and the Reformation — Don't Confuse Them</h3>
  <p>Examiners sometimes test whether you can tell these two apart, since both happened around the same time and are connected but are NOT the same thing.</p>
  <ul>
    <li>The <b>Renaissance</b> was primarily about the revival of classical learning, humanism, art, and confidence in human reason.</li>
    <li>The <b>Reformation</b> (starting with Martin Luther in 1517) was a religious movement that broke away from the authority of the Roman Catholic Church, leading to the rise of Protestantism (in England, the Church of England under Henry VIII).</li>
    <li>They influenced each other: the humanist habit of questioning old authorities and going back to original sources (in the Renaissance's case, classical texts; in the Reformation's case, the Bible in its original languages) is a shared spirit of both movements. In England, both unfolded together across the 16th century and together reshaped English religious, intellectual, and literary life.</li>
  </ul>
  `

{
  id:"features", color:"gold", eyebrow:"3 · Core Content",

  sub:"The single most important section — learn this thoroughly",
  body:`
  <p class="dropcap">This is the heart of the topic. Almost every question on the Renaissance is really asking you to explain these features clearly, with examples. Do not just list the words — understand the idea behind each one.</p>

  <h3 class="h">1. Humanism</h3>
  <p><b>Humanism</b> is the single most important idea of the Renaissance. It means placing human beings, human reason, and human potential at the centre of attention — studying classical Greek and Roman writers not for religious reasons but because they show the greatness of human thought, eloquence, and achievement.</p>
  <ul>
    <li>Humanist education (called <b>"the New Learning"</b>) focused on the "studia humanitatis" — grammar, rhetoric, poetry, history, and moral philosophy, based on Greek and Latin classics.</li>
    <li>Example: Sir Thomas More's <i>Utopia</i> (1516) imagines an ideal society governed by reason rather than blind religious tradition — a very humanist idea.</li>
  </ul>

  <h3 class="h">2. Individualism</h3>
  <p>In the Middle Ages, a person's identity came mainly from their place in a fixed social or religious order (a peasant, a monk, a knight — defined by their group and role). The Renaissance encouraged the idea that <b>a single human being, through their own talent, effort, and will, could achieve great and unique things</b> — this new confidence in the individual is called <b>individualism</b>.</p>
  <ul>
    <li>This is why Renaissance literature is full of ambitious, larger-than-life individual characters who try to rise above their fixed place in life — for example, Christopher Marlowe's heroes (Doctor Faustus, who wants unlimited knowledge and power; Tamburlaine, who wants unlimited conquest) are extreme examples of Renaissance individual ambition.</li>
  </ul>

  <h3 class="h">3. This-Worldliness (Secularism)</h3>
  <p>Medieval literature focused heavily on the afterlife, sin, and salvation. Renaissance literature, without necessarily rejecting religion, showed a new interest in <b>life in THIS world</b> — beauty, love, nature, power, human emotion, and worldly success — valued for their own sake, here and now.</p>

  <h3 class="h">4. Revival of Classical Learning</h3>
  <ul>
    <li>Writers directly imitated, translated, and adapted Greek and Roman authors: Latin poets like <b>Ovid, Virgil, and Horace</b>, and Greek dramatists and philosophers, were studied closely and used as models of good style and wisdom.</li>
    <li>Classical mythology (Greek and Roman gods, heroes, and stories) became a constant source of images and references in Renaissance poetry and drama.</li>
    <li>Classical literary forms were revived or newly introduced into English — for example, the <b>sonnet</b> (from Italy, via Petrarch), the <b>epic</b> (from Homer and Virgil), and classical ideas of <b>tragedy and comedy</b> (from Greek and Roman drama, especially the Roman playwright Seneca's influence on English tragedy).</li>
  </ul>

  <h3 class="h">5. Scientific Curiosity and the Spirit of Enquiry</h3>
  <p>The Renaissance encouraged questioning old authorities and testing ideas through observation and reason rather than simply accepting tradition — the same spirit that, a little later, produced modern science (Copernicus questioning the old idea that the sun goes around the earth is a famous example from this period).</p>
  <ul>
    <li>In literature, this shows up as an eagerness for knowledge for its own sake — Marlowe's Doctor Faustus, who sells his soul for unlimited knowledge, is again a perfect literary example of this restless intellectual curiosity (and also of its dangers).</li>
  </ul>

  <h3 class="h">6. Love of Beauty and the Arts</h3>
  <p>The Renaissance produced an explosion of achievement in painting, sculpture, architecture, music, and literature, based on the belief that creating and appreciating beauty is one of the highest human activities. In literature, this shows as very rich, ornamented, sensuous language and careful attention to poetic form and style.</p>

  <h3 class="h">7. Patriotism and National Pride</h3>
  <p>In England specifically, the Renaissance period (especially under Elizabeth I, after England's naval victory over the Spanish Armada in 1588) produced strong national pride and confidence, visible in literature that celebrates England's history, language, and greatness — for example, Shakespeare's history plays, and Edmund Spenser's <i>The Faerie Queene</i>, which was written partly to honour Queen Elizabeth I.</p>

  <h3 class="h">8. Tension Between Old and New (A Sophisticated Point)</h3>
  <p>A really strong answer notes that the English Renaissance was not a simple, one-way move away from medieval ideas — many Renaissance writers still held on to medieval religious beliefs and medieval ideas about a fixed, ordered universe (often called the <b>"Elizabethan World Picture"</b> — the idea that the universe has a fixed hierarchy, or "Great Chain of Being," from God down to the lowest creature). The most interesting Renaissance literature (like Shakespeare's tragedies or Doctor Faustus) often comes from the tension between old medieval order and new Renaissance ambition and individualism.</p>

  <div class="card crimson">
    <span class="card-label">How To Use This List In An Exam</span>
    <p style="margin:0">Do not just write "humanism, individualism, this-worldliness..." as a bare list. For full marks, take any 5-6 of these points, give each its own short paragraph, explain the idea in your own words, and support it with ONE concrete literary example (author + work + brief detail). That structure alone can carry a full 20-mark answer.</p>
  </div>
  `
},

  sub:"The people who carried the Renaissance into English literature",
  body:`
  <p class="dropcap">You do not need to write full biographies of every name below — you need to know WHO they were and HOW they show a Renaissance quality, so you can drop them into an answer as supporting examples.</p>

  <h3 class="h">Early Humanist / Prose Writers</h3>
  <ul>
    <li><b>Sir Thomas More (1478-1535)</b> — statesman and humanist scholar; his <i>Utopia</i> (1516, originally written in Latin) imagines an ideal, reason-governed society — a classic humanist text.</li>
    <li><b>Roger Ascham (1515-1568)</b> — humanist educationist; wrote <i>The Schoolmaster</i>, promoting classical, humanist education.</li>
  </ul>

  <h3 class="h">Early Renaissance Poets (Introducing New Forms)</h3>
  <ul>
    <li><b>Sir Thomas Wyatt (1503-1542)</b> — usually credited with introducing the <b>Italian (Petrarchan) sonnet</b> into English poetry, after his travels in Italy.</li>
    <li><b>Henry Howard, Earl of Surrey (1517-1547)</b> — developed the sonnet form further and is credited with introducing <b>blank verse</b> (unrhymed iambic pentameter) into English, through his translation of parts of Virgil's <i>Aeneid</i> — blank verse later became the standard verse form of English Renaissance drama, including Shakespeare and Marlowe.</li>
  </ul>

  <h3 class="h">Elizabethan Poets</h3>
  <ul>
    <li><b>Sir Philip Sidney (1554-1586)</b> — the model Renaissance courtier: soldier, poet, and scholar. Wrote <i>Astrophel and Stella</i> (a major sonnet sequence) and <i>The Defence of Poesy</i> (an important work of literary criticism defending the value of poetry, itself a very humanist argument).</li>
    <li><b>Edmund Spenser (1552-1599)</b> — wrote <i>The Faerie Queene</i>, a long allegorical epic in praise of Queen Elizabeth I and Christian-chivalric virtue, blending medieval chivalric romance with Renaissance classical epic form; also wrote the sonnet sequence <i>Amoretti</i>.</li>
  </ul>

  <h3 class="h">Elizabethan Dramatists — "The University Wits"</h3>
  <p>A group of Oxford- and Cambridge-educated playwrights active just before and alongside early Shakespeare, who brought classical learning and dramatic technique into English drama, is called the <b>"University Wits."</b> This group includes:</p>
  <ul>
    <li><b>Christopher Marlowe (1564-1593)</b> — the most important of the group; wrote <i>Doctor Faustus</i>, <i>Tamburlaine the Great</i>, and <i>The Jew of Malta</i>. His plays are famous for their "mighty line" (powerful blank verse) and their larger-than-life, ambitious "overreaching" heroes — the clearest dramatic embodiment of Renaissance individualism.</li>
    <li><b>Robert Greene, Thomas Kyd, John Lyly, George Peele, Thomas Nashe</b> — other University Wits; Kyd's <i>The Spanish Tragedy</i> is especially important as an early, influential English revenge tragedy (itself inspired by the Roman playwright Seneca).</li>
  </ul>

  <h3 class="h">The Central Figure — William Shakespeare (1564-1616)</h3>
  <p>Shakespeare is treated in full detail in a later section, but note here that he is considered the supreme example of the English Renaissance in literature, combining every feature discussed above — classical learning, humanism, individualism, love of language and beauty, and deep interest in human psychology.</p>

  <h3 class="h">Later Renaissance / Metaphysical Figure — John Donne (1572-1631)</h3>
  <p>Donne, discussed in detail later, represents the Renaissance carried into a new, more intellectual and personal direction, blending Renaissance learning (science, geography, philosophy) with intensely individual, unconventional love poetry and religious poetry.</p>

  <h3 class="h">The Final Flowering — John Milton (1608-1674)</h3>
  <p>Milton, writing mostly after the great Elizabethan-Jacobean period, is often seen as the last great voice of English literary Renaissance humanism — deeply schooled in classical languages and literature, and author of <i>Paradise Lost</i>, England's greatest classical-style epic.</p>

  <h3 class="h">Prose and Philosophy</h3>
  <ul>
    <li><b>Francis Bacon (1561-1626)</b> — philosopher and essayist; his <i>Essays</i> show the Renaissance spirit of practical, worldly wisdom, and his scientific writings (like the <i>Novum Organum</i>) show the Renaissance spirit of scientific enquiry, arguing for knowledge based on observation and experiment rather than old authority.</li>
  </ul>

  <div class="card gold">
    <span class="card-label">Exam Tip Line (memorise this)</span>
    <p style="margin:0">"The Renaissance in English literature moved from the early humanist prose of More and Ascham, through the sonnet innovations of Wyatt and Surrey, to its Elizabethan flowering in Sidney, Spenser, Marlowe and Shakespeare, before finding its later, more intellectual expression in Donne and its final classical grandeur in Milton."</p>
  </div>
  `
},

{
  id:"drama-poetry", color:"crimson", eyebrow:"5 · Genres",
  title:"Renaissance Drama and Poetry",
  sub:"How the Renaissance spirit shaped the two major literary forms of the age",
  body:`
  <p class="dropcap">The Renaissance did not just supply new ideas — it also reshaped HOW English writers wrote, giving drama and poetry new forms, new subjects, and a new energy. This section explains both separately.</p>

  <h3 class="h">Renaissance Drama</h3>
  <h4 class="h4">Background</h4>
  <ul>
    <li>Medieval English drama had mainly been religious: <b>Mystery plays</b> (retelling Bible stories) and <b>Morality plays</b> (allegorical stories teaching a moral lesson, with characters like "Everyman" or personified Vices and Virtues).</li>
    <li>Renaissance drama grew out of this medieval tradition but transformed it using classical models — especially <b>Seneca</b> (Roman tragedy, known for revenge, ghosts, and violent bloodshed) and classical ideas of structure and character.</li>
  </ul>
  <h4 class="h4">Key Features of Renaissance (Elizabethan-Jacobean) Drama</h4>
  <ul>
    <li><b>Blank verse</b> (introduced by Surrey, developed by Marlowe, perfected by Shakespeare) became the standard verse form of serious drama — flexible enough for both grand speeches and natural-sounding dialogue.</li>
    <li>A shift from flat, allegorical medieval characters (like "Everyman") to <b>complex, psychologically real individual characters</b> with mixed motives and inner conflict — a direct result of Renaissance individualism and interest in human psychology.</li>
    <li>Popularity of the <b>revenge tragedy</b> (Kyd's <i>The Spanish Tragedy</i>, later Shakespeare's <i>Hamlet</i>) — inspired by Senecan Roman tragedy.</li>
    <li>The rise of purpose-built public theatres (like the Globe Theatre), making drama a major, popular form of entertainment for people of all classes, not just the court.</li>
    <li>The "overreacher" hero — an ambitious individual who reaches beyond normal human limits (Marlowe's Faustus and Tamburlaine; in a more complex form, several of Shakespeare's tragic heroes) — a direct dramatic expression of Renaissance individualism and its dangers.</li>
  </ul>

  <h3 class="h">Renaissance Poetry</h3>
  <h4 class="h4">The Sonnet</h4>
  <ul>
    <li>Introduced from Italy (Petrarch's form) by Wyatt, developed by Surrey (who created the form later called the "Shakespearean" or English sonnet: three quatrains and a final rhyming couplet), and brought to its peak in <b>sonnet sequences</b> — long connected series of sonnets, usually about love — by Sidney (<i>Astrophel and Stella</i>), Spenser (<i>Amoretti</i>), and Shakespeare (<i>Sonnets</i>, 1609).</li>
    <li>Typical sonnet subject: idealised romantic love, often addressed to a beautiful, sometimes cruel or unreachable beloved, using rich classical and natural imagery.</li>
  </ul>
  <h4 class="h4">The Epic</h4>
  <ul>
    <li>Inspired directly by classical epics (Homer's <i>Iliad</i> and <i>Odyssey</i>, Virgil's <i>Aeneid</i>), Renaissance English poets attempted grand, long narrative poems on heroic or moral themes.</li>
    <li>Spenser's <i>The Faerie Queene</i> is the great Elizabethan example; Milton's <i>Paradise Lost</i>, written later, is the supreme English example of the classical epic form, discussed further in the Milton section.</li>
  </ul>
  <h4 class="h4">Pastoral Poetry</h4>
  <ul>
    <li>Poetry describing an idealised countryside life of shepherds — another classical form (from the Roman poet Virgil) revived in the Renaissance; Spenser's <i>The Shepheardes Calender</i> is a key English example, and Christopher Marlowe's short poem "The Passionate Shepherd to His Love" is a famous, simpler example of this taste for pastoral beauty and pleasure.</li>
  </ul>
  <h4 class="h4">Use of Classical Mythology and Allusion</h4>
  <ul>
    <li>Renaissance poetry is full of references to Greek and Roman gods, heroes, and stories (Venus, Cupid, Apollo, and so on), used to add richness, beauty, and shared cultural meaning to descriptions of love, beauty, or heroism.</li>
  </ul>

  <div class="card emerald">
    <span class="card-label">One Sentence To Remember</span>
    <p style="margin:0">Renaissance drama took the moral seriousness of medieval religious drama and gave it classical form (Senecan tragedy, blank verse) and psychologically real individual heroes; Renaissance poetry took classical forms (sonnet, epic, pastoral) and filled them with new confidence in human love, beauty, and individual feeling.</p>
  </div>
  `
},

{
  id:"shakespeare", color:"indigo", eyebrow:"6 · Author Focus",
  title:"Renaissance Features in Shakespeare",
  sub:"Why Shakespeare is called the fullest flowering of the English Renaissance",
  body:`
  <p class="dropcap">Since Shakespeare is separately named in Section A of your syllabus, questions may directly ask you to show Renaissance features THROUGH Shakespeare. This section gives you a ready structure for exactly that kind of question.</p>

  <h3 class="h">1. Humanism and Deep Interest in the Individual Human Mind</h3>
  <p>Shakespeare's greatest achievement is arguably his ability to create characters with rich, believable inner lives — people who think, doubt, change their minds, and struggle with themselves. This intense interest in the human individual mind (not just outward action) is pure Renaissance humanism.</p>
  <ul>
    <li>Example: <b>Hamlet</b>'s famous soliloquies ("To be, or not to be...") show a mind turned inward, examining its own thoughts and doubts in a way medieval drama never attempted.</li>
  </ul>

  <h3 class="h">2. Individualism and the "Overreaching" or Ambitious Hero</h3>
  <ul>
    <li>Example: <b>Macbeth</b>'s ambition to become king by any means, defying the natural, divinely ordered order of succession, shows the dangerous side of Renaissance individual ambition (and the play shows the cost of upsetting the "natural order").</li>
  </ul>

  <h3 class="h">3. Use of Classical Learning and Sources</h3>
  <ul>
    <li>Shakespeare drew directly on classical and Renaissance-Italian sources: Roman history (Plutarch's <i>Lives</i>, used for <i>Julius Caesar</i> and <i>Antony and Cleopatra</i>), Italian stories and settings (<i>Romeo and Juliet</i>, <i>Othello</i>, <i>The Merchant of Venice</i> are all set in Italy, the birthplace of the Renaissance), and classical mythology scattered throughout his plays and poems.</li>
  </ul>

  <h3 class="h">4. This-Worldliness and Celebration of Human Life</h3>
  <p>Even in his tragedies, Shakespeare shows enormous appetite for the richness of human life on earth — love, wit, political power, beauty, humour — rather than focusing mainly on preparing for the afterlife, which marks him as fully Renaissance rather than medieval in his outlook.</p>

  <h3 class="h">5. Language, Beauty and Poetic Form</h3>
  <ul>
    <li>His mastery of blank verse (developed from Marlowe) and his <i>Sonnets</i> (1609) — following the sonnet tradition of Wyatt, Surrey, Sidney, and Spenser — show the Renaissance love of poetic beauty and formal skill.</li>
  </ul>

  <h3 class="h">6. National Pride</h3>
  <ul>
    <li>His history plays (like <i>Henry V</i>) reflect the strong patriotic, national pride typical of the Elizabethan Renaissance period, especially after England's victory over the Spanish Armada in 1588.</li>
  </ul>

  <h3 class="h">7. The Tension Between Old (Medieval) Order and New (Renaissance) Individualism</h3>
  <p>A sophisticated point for top marks: Shakespeare's tragedies often get their power from the clash between an older medieval idea of a fixed, God-given natural order (king, family, social rank) and a new Renaissance-style individual who wants to act on personal ambition, love, or judgment regardless of that order — for example, Macbeth defying the natural order of kingship, or King Lear's world falling into chaos once natural, hierarchical bonds (father-daughter, king-subject) are broken.</p>

  <div class="card indigo">
    <span class="card-label">One Sentence To Remember</span>
    <p style="margin:0">Shakespeare is called the fullest flowering of the English Renaissance because his work combines humanist interest in the individual mind, confident and richly beautiful use of language, deep use of classical and Italian sources, and a fully "this-worldly" celebration of human life, love, and ambition — while still showing the tension between old medieval order and new Renaissance individualism that gives his tragedies their power.</p>
  </div>
  `
},

{
  id:"milton", color:"gold", eyebrow:"7 · Author Focus",
  title:"Renaissance Features in Milton",
  sub:"The last great voice of English literary Renaissance humanism",
  body:`
  <p class="dropcap">John Milton (1608-1674) wrote mostly during and after the English Civil War, well after Shakespeare's death — so at first this may seem "too late" to call Renaissance. But Milton is regularly described in literary history as the last great English Renaissance humanist, because his mind, education, and poetic ambition were formed entirely by Renaissance classical learning, even though he lived into a later, more troubled political age.</p>

  <h3 class="h">1. Deep Classical Learning (The Clearest Renaissance Feature)</h3>
  <ul>
    <li>Milton was one of the most classically learned poets in English literary history — fluent in Latin, Greek, and several modern languages, and deeply read in classical epic, especially <b>Homer</b> and <b>Virgil</b>.</li>
    <li>His masterpiece, <i>Paradise Lost</i> (1667), is deliberately written as a classical epic in the tradition of Homer's <i>Iliad</i>/<i>Odyssey</i> and Virgil's <i>Aeneid</i> — using classical epic devices such as the invocation to a Muse at the very start, beginning "in medias res" (in the middle of the action), long formal speeches, epic similes (long, elaborate comparisons), and grand, elevated style.</li>
  </ul>

  <h3 class="h">2. Humanism</h3>
  <ul>
    <li>Milton's belief in the dignity, reasoning power, and moral responsibility of the individual human being (seen clearly in how he presents Adam and Eve's capacity for reason and free choice in <i>Paradise Lost</i>) is a direct continuation of Renaissance humanist thought.</li>
    <li>His prose work <i>Areopagitica</i> (1644) is a passionate humanist argument for freedom of the press and free thought, based on the belief that human reason, if left free, can tell truth from falsehood — a very Renaissance-humanist argument.</li>
  </ul>

  <h3 class="h">3. Individualism</h3>
  <ul>
    <li>Even his portrayal of Satan in <i>Paradise Lost</i> — a proud, defiant, larger-than-life individual who refuses to submit to a higher authority ("Better to reign in Hell, than serve in Heaven") — echoes the Renaissance "overreacher" figure seen earlier in Marlowe's heroes, even though Milton's moral purpose is to show the danger and sin of this kind of pride.</li>
  </ul>

  <h3 class="h">4. Renaissance Epic Form Put To A New, Christian Purpose</h3>
  <p>A very good exam point: Milton takes the classical (pagan) epic form — used earlier by Homer and Virgil to celebrate heroic warriors and the founding of nations — and uses this same grand Renaissance-classical form to tell a completely <b>Christian</b> story (the fall of Man), blending classical literary technique with Christian religious content. This blending of classical form and Christian subject is itself a very Renaissance achievement — the same instinct that made Spenser blend classical epic with Christian-chivalric virtue in <i>The Faerie Queene</i>.</p>

  <h3 class="h">5. Coming At The "End" Of The Movement</h3>
  <p>By Milton's time, the political and religious upheavals of the English Civil War (1642-1651) had changed English society — the confident, court-centred Renaissance world of Elizabeth I was long gone. This is why literary historians often call Milton the "last" great Renaissance humanist: he carries the movement's classical learning and belief in human reason and dignity into a much later, darker, more troubled age, giving it one final, monumental expression in <i>Paradise Lost</i>.</p>

  <div class="card gold">
    <span class="card-label">One Sentence To Remember</span>
    <p style="margin:0">Milton represents the final, most classically learned flowering of English Renaissance humanism: he uses the grand classical epic form of Homer and Virgil, filled with Renaissance-humanist belief in human reason and dignity, to tell a Christian story — making <i>Paradise Lost</i> a bridge between the Renaissance and the deeply religious, troubled world of 17th-century England.</p>
  </div>
  `
},

{
  id:"donne", color:"emerald", eyebrow:"8 · Author Focus",
  title:"Renaissance Features in Donne",
  sub:"How Donne combines Renaissance learning with a strikingly modern, individual voice",
  body:`
  <p class="dropcap">John Donne (1572-1631) is usually studied as the founder of <b>Metaphysical poetry</b> — a later, related topic on your syllabus. But he is also a very good example of the Renaissance carried into its later, more intellectual and personal stage, so an examiner can easily ask you to discuss him from this angle instead. Since your outline specifically asks for "Renaissance Features and Elements in John Donnian Works," this section focuses only on THAT angle, not on metaphysical conceits in general.</p>

  <h3 class="h">1. Individualism Taken To An Extreme — The Personal, Unconventional Voice</h3>
  <ul>
    <li>Where earlier Renaissance love poetry (like Petrarchan sonnets) followed set conventions — praising the beloved's beauty in fixed, polished, often repeated images — Donne breaks these conventions and writes in a startlingly <b>personal, individual, conversational voice</b>, as if he is a single, unique thinking person arguing, questioning, and reasoning aloud, not following a formula.</li>
    <li>This intense insistence on his own individual perspective, even when it goes against convention, is Renaissance individualism pushed to its most extreme, personal form.</li>
  </ul>

  <h3 class="h">2. Renaissance Learning and Wide Intellectual Curiosity</h3>
  <ul>
    <li>Donne's poetry is packed with references to the "New Learning" of his age: contemporary science, geography, astronomy, law, medicine, and philosophy — for example, using the new science of navigation and map-making, or the recent astronomical discovery that the earth was not the fixed centre of the universe, as sources for his poetic comparisons ("conceits").</li>
    <li>This eager use of the newest available knowledge from every field, and his confident mixing of that knowledge with poetry, is a very Renaissance trait — the same restless intellectual curiosity we saw in Marlowe's Faustus, but used here for wit and argument rather than tragic ambition.</li>
  </ul>

  <h3 class="h">3. This-Worldliness — Intense Physical and Emotional Love Poetry</h3>
  <ul>
    <li>In his love poems (the <i>Songs and Sonnets</i>), Donne celebrates physical, earthly, passionate love directly and boldly, treating romantic and even sexual love as worthy of serious intellectual and poetic attention — a clear example of Renaissance "this-worldliness," valuing human experience in this world rather than only spiritual or otherworldly concerns.</li>
  </ul>

  <h3 class="h">4. Blend of Classical Rhetoric and New Argumentative Style</h3>
  <ul>
    <li>Donne was trained in classical rhetoric (the art of persuasive argument, a core subject of Renaissance humanist education), and his poems are often built like small, tightly reasoned arguments or debates — a very learned, Renaissance-educated way of structuring a poem.</li>
  </ul>

  <h3 class="h">5. Religious Individualism In His Later, Devotional Poetry</h3>
  <ul>
    <li>After becoming a clergyman later in life, Donne wrote intense religious poetry (the <i>Holy Sonnets</i>) that treats his relationship with God in the same passionate, personal, individual, almost physical way he once wrote about romantic love — showing that Renaissance individualism, once developed, could reshape religious poetry just as powerfully as it reshaped love poetry.</li>
  </ul>

  <h3 class="h">6. Where Donne Moves Beyond "Typical" Renaissance Poetry</h3>
  <p>A sophisticated point for top marks: while Elizabethan poets like Spenser and Sidney followed relatively smooth, musical, conventionally beautiful Renaissance verse, Donne's verse is often deliberately rough, dramatic, and argumentative, using far-fetched intellectual comparisons ("conceits," such as comparing two lovers' souls to the two legs of a drawing compass). This shows the Renaissance spirit of intellectual daring and individual originality being pushed into a new, more complex, more "modern-feeling" direction — which is exactly why Donne is remembered as the founder of a new school, Metaphysical poetry, that grew directly out of late-Renaissance intellectual confidence.</p>

  <div class="card emerald">
    <span class="card-label">One Sentence To Remember</span>
    <p style="margin:0">Donne represents the Renaissance carried to its most personal and intellectual extreme: he combines Renaissance humanist learning (science, philosophy, rhetoric), Renaissance individualism (a bold, unconventional personal voice), and Renaissance this-worldliness (intense physical and emotional love poetry), while pushing all of this into the sharper, more argumentative style that would come to be called Metaphysical poetry.</p>
  </div>
  `
},

{
  id:"model-answers", color:"crimson", eyebrow:"9 · Practice",
  title:"Full Model Answers",
  sub:"Two complete, exam-ready answers — study their structure carefully",
  body:`
  <p class="dropcap">Below are two full-length model answers written the way you should write them in the actual UPPSC GIC Mains exam: a short <b>introduction</b>, clearly organised <b>body points with sub-headings</b>, and a short <b>conclusion</b>. Focus on the structure — you can use your own sentences, but follow this pattern.</p>

  <div class="answer-block">
  <h5>Model Answer 1</h5>
  <p><b>Q. What do you understand by the term "Renaissance"? Discuss its origin and main features as reflected in English literature. (20 marks)</b></p>

  <h4 class="h4">Introduction</h4>
  <p>The word "Renaissance" means "rebirth," and it refers to the great revival of interest in classical Greek and Roman learning, art, and values that began in 14th-century Italy and gradually spread across Europe, reaching England by the late 15th century and flowering fully during the Elizabethan and early Jacobean period. Unlike the medieval outlook, which centred human life around religion and the afterlife, the Renaissance placed new value on human reason, individual achievement, and the richness of life in this world.</p>

  <h4 class="h4">Origin</h4>
  <p>The Renaissance began in Italy, especially Florence, aided by the physical presence of Roman ruins and manuscripts, the arrival of Greek scholars and texts after the fall of Constantinople in 1453, and the invention of the printing press around 1450, which allowed classical and new ideas to spread rapidly. In England, humanist scholars like Sir Thomas More and Roger Ascham, along with royal patronage under the Tudor monarchs, especially Elizabeth I, helped establish the "New Learning" and encourage literature and scholarship.</p>

  <h4 class="h4">Main Features</h4>
  <p>The Renaissance introduced <b>humanism</b>, a new focus on human reason and classical learning, as seen in More's <i>Utopia</i>; <b>individualism</b>, a confidence that a single person could achieve greatness through personal talent, seen in the ambitious heroes of Marlowe's plays; <b>this-worldliness</b>, a new interest in earthly love, beauty, and achievement rather than only the afterlife; a <b>revival of classical learning</b>, visible in the use of Greek and Roman literary forms such as the sonnet and the epic; a new <b>spirit of scientific enquiry</b>, seen in the restless curiosity of characters like Doctor Faustus; and strong <b>national pride</b>, reflected in Shakespeare's history plays and Spenser's <i>The Faerie Queene</i>.</p>

  <h4 class="h4">Conclusion</h4>
  <p>The Renaissance thus transformed English literature by shifting its centre of gravity from religious duty and fixed medieval order towards human reason, individual ambition, and the celebration of earthly life, laying the intellectual and artistic foundation for the great literary achievements of Shakespeare, Donne, and, later, Milton.</p>
  </div>

  <div class="rule" style="color:var(--ink-faint)"></div>

  <div class="answer-block">
  <h5>Model Answer 2</h5>
  <p><b>Q. "Shakespeare is the fullest flowering of the Renaissance spirit in English literature." Discuss. (20 marks)</b></p>

  <h4 class="h4">Introduction</h4>
  <p>The Renaissance brought to English literature a new confidence in human reason, individual achievement, classical learning, and the value of earthly life, in place of the fixed, religion-centred outlook of the Middle Ages. William Shakespeare, writing at the height of the Elizabethan-Jacobean period, is widely regarded as the fullest embodiment of this Renaissance spirit, because his work combines nearly every feature of the movement at once.</p>

  <h4 class="h4">Humanism and the Individual Mind</h4>
  <p>Shakespeare's central achievement is his creation of psychologically complex individual characters with rich inner lives, best seen in Hamlet's soliloquies, where a mind turns inward to examine its own doubts — a distinctly humanist interest in the individual human consciousness rather than in fixed, allegorical types.</p>

  <h4 class="h4">Individualism and Ambition</h4>

  <p>Shakespeare drew extensively on classical history through Plutarch's <i>Lives</i> for plays like <i>Julius Caesar</i>, and on Italian settings and stories for plays like <i>Romeo and Juliet</i> and <i>Othello</i>, directly connecting his work to the birthplace of the Renaissance.</p>

  <p>Even in tragedy, Shakespeare shows an intense appetite for the beauty and richness of earthly life, and his mastery of blank verse and his <i>Sonnets</i> reflect the Renaissance love of poetic beauty and formal skill inherited from Wyatt, Surrey, and Sidney.</p>

  <p>By combining humanist depth of characterisation, confident individualism, classical learning, patriotic pride, and supreme mastery of poetic language, Shakespeare draws together every major strand of the Renaissance, justifying his reputation as the fullest and most complete literary expression of that great movement.</p>

/* ================= APP LOGIC ================= */
(function(){
  const COLOR_MAP = { crimson:'#9c2b3e', emerald:'#1f5c4a', gold:'#b8862f', indigo:'#2e3f6e' };
  SECTIONS.forEach(s => { s.colorHex = COLOR_MAP[s.color] || '#9c2b3e'; });

  const contentWrap = document.getElementById('contentWrap');
  const drawerList = document.getElementById('drawerList');
  const drawer = document.getElementById('drawer');
  const scrim = document.getElementById('scrim');
  const menuBtn = document.getElementById('menuBtn');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const dotsWrap = document.getElementById('dots');
  const progressPill = document.getElementById('progressPill');
  const topTitle = document.getElementById('topTitle');

  let current = 0;

  function loadLastSection(){
    try{
      const saved = window.localStorage.getItem(STORAGE_KEY);
      if(saved !== null){
        const idx = parseInt(saved, 10);
        if(!isNaN(idx) && idx >= 0 && idx < SECTIONS.length) return idx;
      }
    }catch(e){ /* localStorage unavailable — silently ignore */ }
    return 0;
  }

  function saveCurrentSection(idx){
    try{ window.localStorage.setItem(STORAGE_KEY, String(idx)); }catch(e){ /* ignore */ }
  }

  function showResumeToast(idx){
    if(idx === 0) return;
    const toast = document.createElement('div');
    toast.textContent = 'Resumed at: ' + SECTIONS[idx].title;
    toast.style.cssText = 'position:absolute; left:50%; bottom:78px; transform:translateX(-50%);'
      + 'background:var(--indigo-deep); color:#fbf6ea; font-family:"Source Serif 4",serif; font-size:12.5px;'
      + 'padding:8px 16px; border-radius:999px; box-shadow:0 6px 18px rgba(0,0,0,0.3); z-index:40; opacity:0;'
      + 'transition:opacity .3s ease; white-space:nowrap; max-width:85%; overflow:hidden; text-overflow:ellipsis;';
    document.querySelector('.app').appendChild(toast);
    requestAnimationFrame(() => { toast.style.opacity = '1'; });
    setTimeout(() => {
      toast.style.opacity = '0';
      setTimeout(() => toast.remove(), 350);
    }, 2200);
  }

  // Build SECTIONS
  SECTIONS.forEach((s, i) => {
    const sec = document.createElement('div');
    sec.className = 'section';
    sec.id = 'sec-' + s.id;
    sec.innerHTML = `
      <span class="sec-eyebrow" style="background:${s.colorHex}">${s.eyebrow}</span>
      <h2 class="sec-title">${s.title}</h2>
      <p class="sec-sub" style="border-color:${s.colorHex}; color:${s.colorHex}">${s.sub}</p>
      ${s.body}
    `;
    contentWrap.appendChild(sec);
  });

  // Build drawer list
  SECTIONS.forEach((s, i) => {
    const li = document.createElement('li');
    const btn = document.createElement('button');
    btn.innerHTML = `<span class="num" style="background:${s.colorHex}">${i+1}</span><span class="ttl">${s.title}</span>`;
    btn.addEventListener('click', () => { goTo(i); closeDrawer(); });
    btn.dataset.idx = i;
    li.appendChild(btn);
    drawerList.appendChild(li);
  });

  // Build dots
  SECTIONS.forEach((s, i) => {
    const d = document.createElement('div');
    d.className = 'dot';
    dotsWrap.appendChild(d);
  });

  function render(){
    document.querySelectorAll('.section').forEach((el, i) => {
      el.classList.toggle('active', i === current);
    });
    document.querySelectorAll('.drawer-list button').forEach((el, i) => {
      el.classList.toggle('active', i === current);
    });
    document.querySelectorAll('.dot').forEach((el, i) => {
      el.classList.toggle('on', i === current);
    });
    progressPill.textContent = (current+1) + ' / ' + SECTIONS.length;
    topTitle.textContent = SECTIONS[current].title.replace(/\u2014.*$/,'').trim();
    prevBtn.disabled = current === 0;
    nextBtn.textContent = current === SECTIONS.length-1 ? 'Restart \u2191' : 'Next \u2192';
    contentWrap.scrollTop = 0;
    saveCurrentSection(current);
  }

  function goTo(i){
    current = Math.max(0, Math.min(SECTIONS.length-1, i));
    render();
  }

  prevBtn.addEventListener('click', () => goTo(current-1));
  nextBtn.addEventListener('click', () => {
    if(current === SECTIONS.length-1){ goTo(0); } else { goTo(current+1); }
  });

  function openDrawer(){ drawer.classList.add('open'); scrim.classList.add('open'); }
  function closeDrawer(){ drawer.classList.remove('open'); scrim.classList.remove('open'); }
  menuBtn.addEventListener('click', openDrawer);
  scrim.addEventListener('click', closeDrawer);

  current = loadLastSection();
  render();
  showResumeToast(current);
})();

</script>
</body>
</html>
